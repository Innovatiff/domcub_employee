    </button>

<main class="main">
  <div class="page-header-row">
    <div class="page-header">
      <h1 id="greeting">Panel</h1>
      <p id="todayDate"></p>
    </div>
    <button class="btn btn-primary" onclick="openClockModal()"><ion-icon name="finger-print-outline"></ion-icon> Marcar Entrada / Salida</button>
  </div>

  <div class="stats-grid" id="statsGrid">
    <div class="skeleton-card"></div><div class="skeleton-card"></div>
    <div class="skeleton-card"></div><div class="skeleton-card"></div>
  </div>

  <div class="card" style="margin-bottom:20px;animation-delay:0.1s">
    <div class="card-header">
      <span class="card-title"><ion-icon name="flash-outline" style="color:var(--success)"></ion-icon> Trabajando Ahora</span>
      <span class="badge badge-green live" id="workingCount">—</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Colaborador</th><th>Puesto</th><th>Tienda</th><th>Hora de Entrada</th><th>Horas Acumuladas</th><th></th></tr></thead>
        <tbody id="workingTable"></tbody>
      </table>
    </div>
  </div>

  <div class="card" style="animation-delay:0.16s">
    <div class="card-header">
      <span class="card-title"><ion-icon name="checkbox-outline" style="color:var(--primary)"></ion-icon> Turnos Completados Hoy</span>
      <span class="badge badge-gray" id="doneCount">—</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Colaborador</th><th>Puesto</th><th>Tienda</th><th>Entrada</th><th>Salida</th><th>Horas</th></tr></thead>
        <tbody id="todayTable"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- Modal de Entrada/Salida -->
<div class="modal-overlay" id="clockModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3>Marcar Entrada / Salida</h3>
      <button class="modal-close" onclick="closeModal('clockModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Selecciona un Colaborador</label>
        <select id="clockEmpSelect" onchange="updateClockStatus()"></select>
      </div>
      <div id="clockStatus" style="margin-top:10px"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('clockModal')">Cancelar</button>
      <button class="btn btn-primary" id="clockActionBtn" onclick="doClockAction()">Marcar Entrada</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
const today = new Date();
const hour  = today.getHours();
document.getElementById('greeting').textContent = `${hour < 12 ? 'Buenos días' : hour < 19 ? 'Buenas tardes' : 'Buenas noches'}`;
document.getElementById('todayDate').textContent = formatDateLong(today);


requireAuth(() => { render(); });

async function render() {
  document.getElementById('workingTable').innerHTML = skeletonRows(6, 2);
  document.getElementById('todayTable').innerHTML   = skeletonRows(6, 3);
  try {
    const store = getSelectedStore();
    const [allEmps, jobs, todayCIs] = await Promise.all([
      getEmployees(),
      getJobs(),
      getClockIns({ date: todayStr() })
    ]);

    const emps = store === 'all' ? allEmps : allEmps.filter(e => e.store === store);
    const active = emps.filter(e => e.status === 'active');

    const workingCIs = todayCIs.filter(c => !c.clockOut && (store === 'all' || c.store === store));
    const doneCIs    = todayCIs.filter(c => c.clockOut  && (store === 'all' || c.store === store));
    const todayHours = doneCIs.reduce((s, c) => s + (c.hours || 0), 0);

    // Stats
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card">
        <div class="stat-icon purple"><ion-icon name="people-outline"></ion-icon></div>
        <div class="stat-label">Total de Colaboradores</div>
        <div class="stat-value">${active.length}</div>
        <div class="stat-sub">${allEmps.filter(e=>e.store==='1'&&e.status==='active').length} Despensas · ${allEmps.filter(e=>e.store==='2'&&e.status==='active').length} Cocina</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><ion-icon name="exit-outline"></ion-icon></div>
        <div class="stat-label">Trabajando Ahora</div>
        <div class="stat-value">${workingCIs.length}</div>
        <div class="stat-sub">Con entrada marcada hoy</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon yellow"><ion-icon name="time-outline"></ion-icon></div>
        <div class="stat-label">Horas de Hoy</div>
        <div class="stat-value">${todayHours.toFixed(1)}</div>
        <div class="stat-sub">Turnos completados</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon cyan"><ion-icon name="briefcase-outline"></ion-icon></div>
        <div class="stat-label">Puestos</div>
        <div class="stat-value">${jobs.length}</div>
        <div class="stat-sub">En ambas tiendas</div>
      </div>
    `;
    animateValues('statsGrid');

    // Currently working
    document.getElementById('workingCount').textContent = workingCIs.length + (workingCIs.length === 1 ? ' activo' : ' activos');
    document.getElementById('doneCount').textContent    = doneCIs.length + (doneCIs.length === 1 ? ' turno' : ' turnos');
    const wb = document.getElementById('workingTable');
    if (workingCIs.length === 0) {
      wb.innerHTML = `<tr><td colspan="6"><div class="empty-state"><ion-icon name="time-outline"></ion-icon><p>Ningún colaborador tiene la entrada marcada en este momento.</p></div></td></tr>`;
    } else {
      wb.innerHTML = workingCIs.map(c => {
        const emp = allEmps.find(e => e.id === c.employeeId);
        if (!emp) return '';
        const job = jobs.find(j => j.id === emp.jobId);
        const ci  = c.clockIn && c.clockIn.toDate ? c.clockIn.toDate() : new Date(c.clockIn);
        const hrs = ((Date.now() - ci.getTime()) / 3600000).toFixed(1);
        return `<tr>
          <td><div class="employee-info">${avatarHtml(emp.name)}<div class="employee-name">${emp.name}</div></div></td>
          <td>${job ? `<span class="badge" style="background:${job.color}22;color:${job.color}">${job.title}</span>` : '—'}</td>
          <td>${storeBadge(emp.store)}</td>
          <td>${formatTime(c.clockIn)}</td>
          <td><strong>${hrs}h</strong></td>
          <td><button class="btn btn-sm btn-outline" onclick="quickClockOut('${c.id}')"><ion-icon name="stop-circle-outline"></ion-icon> Marcar Salida</button></td>
        </tr>`;
      }).join('');
    }

    // Today completed
    const tb = document.getElementById('todayTable');
    if (doneCIs.length === 0) {
      tb.innerHTML = `<tr><td colspan="6"><div class="empty-state"><ion-icon name="calendar-clear-outline"></ion-icon><p>No hay turnos completados hoy.</p></div></td></tr>`;
    } else {
      tb.innerHTML = doneCIs.map(c => {
        const emp = allEmps.find(e => e.id === c.employeeId);
        if (!emp) return '';
        const job = jobs.find(j => j.id === emp.jobId);
        return `<tr>
          <td><div class="employee-info">${avatarHtml(emp.name)}<div class="employee-name">${emp.name}</div></div></td>
          <td>${job ? job.title : '—'}</td>
          <td>${storeBadge(emp.store)}</td>
          <td>${formatTime(c.clockIn)}</td>
          <td>${formatTime(c.clockOut)}</td>
          <td><strong>${(c.hours || 0).toFixed(2)}h</strong></td>
        </tr>`;
      }).join('');
    }
  } catch (err) {
    console.error('Dashboard render error:', err);
    toast('No se pudieron cargar los datos del panel.', 'error');
  }
}

async function quickClockOut(ciId) {
  const hrs = await clockOut(ciId);
  toast(`Salida marcada · ${(hrs || 0).toFixed(2)} h registradas`, 'success');
  render();
}

let allEmpsCache = [];

async function openClockModal() {
  allEmpsCache = await getEmployees();
  const active = allEmpsCache.filter(e => e.status === 'active');
  document.getElementById('clockEmpSelect').innerHTML = active.map(e =>
    `<option value="${e.id}">${e.name} — ${storeShort(e.store)}</option>`
  ).join('');
  await updateClockStatus();
  openModal('clockModal');
}

let activeCI = null;

async function updateClockStatus() {
  const empId = document.getElementById('clockEmpSelect').value;
  if (!empId) return;
  activeCI = await getActiveClockIn(empId);
  const btn = document.getElementById('clockActionBtn');
  const st  = document.getElementById('clockStatus');
  if (activeCI) {
    st.innerHTML = `<span class="badge badge-green"><ion-icon name="ellipse" style="font-size:8px"></ion-icon> Entrada marcada desde las ${formatTime(activeCI.clockIn)}</span>`;
    btn.textContent = 'Marcar Salida';
    btn.className = 'btn btn-danger';
  } else {
    st.innerHTML = `<span class="badge badge-gray"><ion-icon name="ellipse" style="font-size:8px"></ion-icon> Sin entrada marcada</span>`;
    btn.textContent = 'Marcar Entrada';
    btn.className = 'btn btn-primary';
  }
}

async function doClockAction() {
  const btn   = document.getElementById('clockActionBtn');
  const empId = document.getElementById('clockEmpSelect').value;
  const emp   = allEmpsCache.find(e => e.id === empId);
  if (!emp) return;
  btn.disabled = true;
  try {
    if (activeCI) {
      const hrs = await clockOut(activeCI.id);
      toast(`${emp.name} marcó salida · ${(hrs || 0).toFixed(2)} h`, 'success');
    } else {
      await clockIn(empId, emp.store);
      toast(`${emp.name} marcó entrada`, 'success');
    }
    closeModal('clockModal');
    render();
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
