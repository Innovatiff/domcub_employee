<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-logo">
      <div class="brand-icon"><svg class="brand-mark" viewBox="7 0 44 44" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M8.6 27C7.6 15.4 15.4 5.4 26.6 5.4C33.4 5.4 37.6 9.2 39 14.3L46.3 16.9C49.5 18.1 49.9 21.3 46.7 25.5C44.9 27.9 42.7 29.6 40.5 30.4C41.9 27.6 41.7 25 40.5 23.6C38.7 21.7 36.1 21.2 33.7 22C32.1 23.8 30.7 26 29.3 28.2C27.7 30.7 26.3 33.8 25 38.6L10.6 33.2C9.2 31.2 8.7 29 8.6 27ZM28.9 13.3C31.1 12.3 33.7 13.1 34.3 15.1C33.1 16.5 30.5 16.5 28.9 15.3Z"/></svg></div>
      <div><div class="brand-name">El Águila</div><div class="brand-sub">Portal de Empleados</div></div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Principal</div>
    <a href="index.html"         class="nav-link"><i class="fa-solid fa-gauge-high"></i><span>Panel</span></a>
    <a href="employees.html"     class="nav-link"><i class="fa-solid fa-users"></i><span>Empleados</span></a>
    <a href="jobs.html"          class="nav-link active"><i class="fa-solid fa-briefcase"></i><span>Puestos</span></a>
    <div class="nav-section-label">Tiempo</div>
    <a href="hours.html"         class="nav-link"><i class="fa-solid fa-clock"></i><span>Horas</span></a>
    <a href="pay-statement.html" class="nav-link"><i class="fa-solid fa-file-invoice-dollar"></i><span>Nómina</span></a>
    <a href="time-off.html"      class="nav-link"><i class="fa-solid fa-calendar-days"></i><span>Permisos</span></a>
  </nav>
  <div class="sidebar-footer">
    <div id="sidebarUser" style="margin-bottom:12px"></div>
    <button class="sidebar-signout" onclick="signOut()">
      <i class="fa-solid fa-right-from-bracket"></i> <span>Cerrar Sesión</span>
    </button>
  </div>
</aside>

<main class="main">
  <div class="page-header-row">
    <div class="page-header">
      <h1>Puestos de Trabajo</h1>
      <p>Administra los puestos disponibles en ambas tiendas de El Águila.</p>
    </div>
    <button class="btn btn-primary" onclick="openJobModal()"><i class="fa-solid fa-plus"></i> Agregar Puesto</button>
  </div>

  <div class="jobs-grid" id="jobsGrid">
    <div class="skeleton-card" style="height:158px"></div>
    <div class="skeleton-card" style="height:158px"></div>
    <div class="skeleton-card" style="height:158px"></div>
  </div>
</main>

<!-- Modal Agregar/Editar -->
<div class="modal-overlay" id="jobModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3 id="jobModalTitle">Agregar Puesto</h3>
      <button class="modal-close" onclick="closeModal('jobModal')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="jobDocId">
      <div class="form-group">
        <label>Nombre del Puesto *</label>
        <input type="text" id="jobTitle" placeholder="ej. Vendedor">
      </div>
      <div class="form-group">
        <label>Departamento</label>
        <input type="text" id="jobDept" placeholder="ej. Ventas">
      </div>
      <div class="form-group">
        <label>Color de Etiqueta</label>
        <div class="color-options" id="colorOptions"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('jobModal')">Cancelar</button>
      <button class="btn btn-primary" id="saveJobBtn" onclick="doSaveJob()">Guardar Puesto</button>
    </div>
  </div>
</div>

<!-- Confirmar Eliminación -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3>Eliminar Puesto</h3>
      <button class="modal-close" onclick="closeModal('deleteModal')">&times;</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-muted);font-size:14px">¿Seguro que deseas eliminar <strong id="deleteJobName"></strong>? Esta acción no se puede deshacer.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('deleteModal')">Cancelar</button>
      <button class="btn btn-danger" id="confirmDeleteBtn" onclick="doDelete()">Eliminar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
const COLORS = ['#4f46e5','#059669','#0891b2','#d97706','#dc2626','#7c3aed','#be185d','#0284c7'];
let selectedColor = COLORS[0];
let deleteDocId   = null;

requireAuth(() => render());

function renderColors() {
  document.getElementById('colorOptions').innerHTML = COLORS.map(c =>
    `<div class="color-opt ${c === selectedColor ? 'selected' : ''}" style="background:${c};color:${c}" onclick="selectColor('${c}')"></div>`
  ).join('');
}

function selectColor(c) { selectedColor = c; renderColors(); }

async function render() {
  const grid = document.getElementById('jobsGrid');
  try {
    const jobs = await getJobs();
    const emps = await getEmployees();

    if (jobs.length === 0) {
      grid.innerHTML = `<div class="card" style="grid-column:1/-1;padding:48px;text-align:center;color:var(--text-muted)">
        <i class="fa-solid fa-briefcase" style="font-size:36px;margin-bottom:12px;display:block;color:var(--text-light)"></i>
        <p>Aún no hay puestos. Agrega uno para comenzar.</p>
      </div>`;
      return;
    }

    grid.innerHTML = jobs.map((j, i) => {
      const count = emps.filter(e => e.jobId === j.id && e.status === 'active').length;
      return `<div class="job-card" style="--job-color:${j.color};animation-delay:${(i * 0.05).toFixed(2)}s">
        <div class="job-card-header">
          <div class="job-dot" style="background:${j.color}"></div>
          <div>
            <div class="job-title">${j.title}</div>
            <div class="job-dept">${j.department || '—'}</div>
          </div>
        </div>
        <div class="job-count"><i class="fa-solid fa-user" style="color:var(--text-light)"></i>${count} ${count === 1 ? 'empleado' : 'empleados'} en este puesto</div>
        <div class="job-actions">
          <button class="btn btn-sm btn-outline" onclick="openJobModal('${j.id}')"><i class="fa-solid fa-pen"></i> Editar</button>
          <button class="btn btn-sm btn-outline" style="color:var(--danger)" onclick="openDelete('${j.id}','${j.title.replace(/'/g,"\\'")}')"><i class="fa-solid fa-trash"></i> Eliminar</button>
        </div>
      </div>`;
    }).join('');
  } catch (err) {
    grid.innerHTML = `<div style="grid-column:1/-1;color:var(--danger);padding:24px">Error al cargar los puestos: ${err.message}</div>`;
    toast('No se pudieron cargar los puestos.', 'error');
  }
}

async function openJobModal(id) {
  let job = null;
  if (id) {
    job = await getJob(id);
  }
  document.getElementById('jobModalTitle').textContent = job ? 'Editar Puesto' : 'Agregar Puesto';
  document.getElementById('jobDocId').value  = job ? job.id : '';
  document.getElementById('jobTitle').value  = job ? job.title : '';
  document.getElementById('jobDept').value   = job ? (job.department || '') : '';
  selectedColor = job ? (job.color || COLORS[0]) : COLORS[0];
  renderColors();
  openModal('jobModal');
}

async function doSaveJob() {
  const title = document.getElementById('jobTitle').value.trim();
  const dept  = document.getElementById('jobDept').value.trim();
  if (!title) { toast('Escribe el nombre del puesto.', 'error'); return; }
  const docId = document.getElementById('jobDocId').value;
  const btn   = document.getElementById('saveJobBtn');
  btn.disabled = true;
  try {
    await saveJob({ title, department: dept, color: selectedColor }, docId || null);
    closeModal('jobModal');
    toast(docId ? 'Puesto actualizado' : `"${title}" agregado`, 'success');
    render();
  } catch (err) {
    toast('Error al guardar: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

function openDelete(id, title) {
  deleteDocId = id;
  document.getElementById('deleteJobName').textContent = title;
  openModal('deleteModal');
}

async function doDelete() {
  if (!deleteDocId) return;
  const btn = document.getElementById('confirmDeleteBtn');
  btn.disabled = true;
  try {
    await deleteJob(deleteDocId);
    closeModal('deleteModal');
    toast('Puesto eliminado', 'success');
    render();
  } catch (err) {
    toast('Error al eliminar: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
