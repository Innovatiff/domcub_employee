<main class="main">
  <div class="page-header-row">
    <div class="page-header">
      <h1>Registros</h1>
      <p>Viajes a las farmacias: kilometraje y horas de cada carro.</p>
    </div>
  </div>

  <!-- Rango -->
  <div class="card" style="padding:13px 18px;margin-bottom:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div class="tabs" style="margin:0">
      <button class="tab-btn active" onclick="rangoRapido('hoy', this)">Hoy</button>
      <button class="tab-btn" onclick="rangoRapido('semana', this)">Esta semana</button>
      <button class="tab-btn" onclick="rangoRapido('mes', this)">Este mes</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
      <input type="date" id="regDesde" onchange="rangoManual()" style="width:auto">
      <span style="color:var(--text-light)">–</span>
      <input type="date" id="regHasta" onchange="rangoManual()" style="width:auto">
    </div>
  </div>

  <!-- Estadísticas -->
  <div class="stats-grid" id="regStats" style="margin-bottom:20px">
    <div class="skeleton-card"></div><div class="skeleton-card"></div>
    <div class="skeleton-card"></div><div class="skeleton-card"></div>
  </div>

  <!-- Tabla -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Viajes</span>
      <span class="badge badge-blue" id="regCount">—</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Fecha</th>
          <th>Colaborador</th>
          <th>Vehículo</th>
          <th>Salida</th>
          <th>Llegada</th>
          <th>Km</th>
          <th>Duración</th>
          <th>Estado</th>
          <th></th>
        </tr></thead>
        <tbody id="regTable"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
let desde = todayStr(), hasta = todayStr();

requireAuth(() => { ponerFechas(); render(); });
function onStoreChange() { render(); }

function ponerFechas() {
  document.getElementById('regDesde').value = desde;
  document.getElementById('regHasta').value = hasta;
}

function rangoRapido(cual, btn) {
  document.querySelectorAll('.tabs .tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const n = new Date();
  if (cual === 'hoy') { desde = hasta = todayStr(); }
  else if (cual === 'semana') { desde = lunesDe(n); hasta = todayStr(); }
  else { desde = toDateStr(new Date(n.getFullYear(), n.getMonth(), 1)); hasta = todayStr(); }
  ponerFechas(); render();
}

function rangoManual() {
  const a = document.getElementById('regDesde').value;
  const b = document.getElementById('regHasta').value;
  if (!a || !b) return;
  if (b < a) { toast('La fecha final no puede ser anterior a la inicial.', 'error'); return; }
  desde = a; hasta = b;
  document.querySelectorAll('.tabs .tab-btn').forEach(x => x.classList.remove('active'));
  render();
}

async function render() {
  document.getElementById('regTable').innerHTML = skeletonRows(9, 3);
  try {
    const regs = await getRegistros({ store: getSelectedStore(), desde, hasta });

    const completos = regs.filter(r => r.status === 'completado');
    const enRuta    = regs.filter(r => r.status === 'en-ruta');
    const kmTotal   = completos.reduce((s, r) => s + (Number(r.km) || 0), 0);
    const minTotal  = completos.reduce((s, r) => s + (Number(r.minutos) || 0), 0);

    document.getElementById('regStats').innerHTML = `
      <div class="stat-card"><div class="stat-icon purple"><ion-icon name="car-outline"></ion-icon></div>
        <div class="stat-label">Viajes</div><div class="stat-value">${regs.length}</div></div>
      <div class="stat-card"><div class="stat-icon cyan"><ion-icon name="speedometer-outline"></ion-icon></div>
        <div class="stat-label">Km recorridos</div><div class="stat-value">${numES(kmTotal, 1)}</div></div>
      <div class="stat-card"><div class="stat-icon yellow"><ion-icon name="time-outline"></ion-icon></div>
        <div class="stat-label">Tiempo en ruta</div><div class="stat-value" style="font-size:20px">${duracionLabel(minTotal)}</div></div>
      <div class="stat-card"><div class="stat-icon green"><ion-icon name="navigate-outline"></ion-icon></div>
        <div class="stat-label">En ruta ahora</div><div class="stat-value">${enRuta.length}</div></div>`;
    animateValues('regStats');

    document.getElementById('regCount').textContent =
      regs.length + (regs.length === 1 ? ' viaje' : ' viajes');

    const tb = document.getElementById('regTable');
    if (!regs.length) {
      tb.innerHTML = `<tr><td colspan="9"><div class="empty-state"><ion-icon name="car-outline"></ion-icon>
        <p>No hay viajes en este rango. Los colaboradores con permiso los registran desde su portal.</p></div></td></tr>`;
      return;
    }

    tb.innerHTML = regs.map(r => {
      const abierto = r.status === 'en-ruta';
      return `<tr${abierto ? ' style="background:var(--success-soft)"' : ''}>
        <td>${formatDateShort(r.date)}</td>
        <td><div class="employee-info">${avatarHtml(r.employeeName)}<div class="employee-name">${escapeHtml(r.employeeName || '—')}</div></div></td>
        <td>${escapeHtml(r.vehiculo || '—')}</td>
        <td>${formatTime(r.horaSalida)}<div class="reg-km">${numES(r.kmSalida, 1)} km</div></td>
        <td>${abierto ? '—' : `${formatTime(r.horaLlegada)}<div class="reg-km">${numES(r.kmLlegada, 1)} km</div>`}</td>
        <td><strong>${abierto ? '—' : numES(r.km, 1)}</strong></td>
        <td>${abierto ? '—' : duracionLabel(r.minutos)}</td>
        <td>${abierto
          ? '<span class="badge badge-green live">En ruta</span>'
          : '<span class="badge badge-gray">Completado</span>'}</td>
        <td><div class="td-actions">
          ${abierto ? `<button class="btn btn-sm btn-outline" onclick="cerrarDesdeGerencia('${r.id}')">Cerrar viaje</button>` : ''}
          <button class="btn-icon btn-sm" onclick="borrarRegistro('${r.id}')" title="Eliminar"><ion-icon name="close-outline" style="font-size:11px"></ion-icon></button>
        </div></td>
      </tr>`;
    }).join('');
  } catch (err) {
    console.error(err);
    toast('Error al cargar: ' + err.message, 'error');
  }
}

/**
 * Cerrar desde aquí es para el olvido: el colaborador salió, volvió y no
 * registró la llegada. La gerencia pone el kilometraje final y la hora se
 * pide también, porque "ahora" ya no es la hora real de llegada.
 */
async function cerrarDesdeGerencia(id) {
  const kmTxt = prompt('Kilometraje de llegada:');
  if (kmTxt === null) return;
  const km = parseFloat(String(kmTxt).replace(',', '.'));
  if (isNaN(km) || km <= 0) { toast('Escribe un kilometraje válido.', 'error'); return; }

  const horaTxt = prompt('Hora de llegada (HH:MM, 24 horas):');
  if (horaTxt === null) return;
  const m = String(horaTxt).trim().match(/^(\d{1,2}):(\d{2})$/);
  if (!m || +m[1] > 23 || +m[2] > 59) { toast('Escribe la hora como HH:MM.', 'error'); return; }

  try {
    const doc = await db.collection('Registros').doc(id).get();
    const fecha = doc.exists ? doc.data().date : todayStr();
    const llegada = firebase.firestore.Timestamp.fromDate(
      new Date(`${fecha}T${String(m[1]).padStart(2, '0')}:${m[2]}:00`));
    const r = await cerrarViaje(id, km, llegada);
    if (r.km < 0) toast('Ojo: la llegada quedó con menos kilómetros que la salida.', 'error');
    else toast(`Viaje cerrado · ${numES(r.km, 1)} km`, 'success');
    render();
  } catch (err) {
    toast('No se pudo cerrar: ' + err.message, 'error');
  }
}

async function borrarRegistro(id) {
  if (!confirm('¿Eliminar este registro de viaje?')) return;
  await deleteRegistro(id);
  toast('Registro eliminado', 'info');
  render();
}
</script>
