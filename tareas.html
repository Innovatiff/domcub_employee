  <!-- Hoy -->

<!-- Modal crear/editar checklist -->
<div class="modal-overlay" id="tareaModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="tareaTitulo">Nueva checklist</h3>
      <button class="modal-close" onclick="closeModal('tareaModal')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="tId">
      <div class="form-group">
        <label>Nombre *</label>
        <input type="text" id="tNombre" placeholder="Apertura, Cierre, Limpieza semanal...">
      </div>
      <div class="form-group">
        <label>Renglones * <span style="font-weight:400;color:var(--text-muted)">— uno por línea</span></label>
        <textarea id="tItems" rows="6" placeholder="Encender equipos&#10;Revisar neveras&#10;Barrer el frente"></textarea>
      </div>
      <div class="form-group">
        <label>Días <span style="font-weight:400;color:var(--text-muted)">— sin marcar ninguno aplica todos los días</span></label>
        <div class="dias-pick" id="tDias"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="tBorrar" style="margin-right:auto;display:none" onclick="borrarTarea()">Eliminar</button>
      <button class="btn btn-outline" onclick="closeModal('tareaModal')">Cancelar</button>
      <button class="btn btn-primary" id="tGuardar" onclick="guardarTarea()">Guardar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
const DIA_NOMBRE = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
let tareas = [], hechos = {};

requireAuth(() => render(), { allow:['manager'] });

async function render() {
  const store = getSelectedStore();
  const hoy = todayStr();
  document.getElementById('hoyLabel').textContent = formatDate(hoy);
  document.getElementById('hoyBody').innerHTML = skeletonRows ? '<div class="empty-state"><ion-icon name="sync-outline" class="gira"></ion-icon></div>' : '';
  try {
    [tareas, hechos] = await Promise.all([getTareas(store), getHechosDe(hoy, store)]);
    pintarHoy();
    pintarPlantillas();
  } catch (err) {
    toast('No se pudieron cargar las tareas: ' + err.message, 'error');
  }
}

function pintarHoy() {
  const hoyDow = new Date().getDay();
  const deHoy = tareas.filter(t => tareaAplicaHoy(t, hoyDow));
  const body = document.getElementById('hoyBody');

  let total = 0, listos = 0;
  const html = deHoy.map(t => {
    const h = (hechos[t.id] && hechos[t.id].hechos) || {};
    const items = t.items || [];
    const n = items.filter((_,i) => h[i]).length;
    total += items.length; listos += n;
    const pct = items.length ? Math.round(n/items.length*100) : 0;
    return `<div class="chk-card ${n===items.length && items.length ? 'lista' : ''}">
      <div class="chk-head">
        <strong>${escapeHtml(t.titulo)}</strong>
        <div class="chk-progreso"><div class="chk-barra"><span style="width:${pct}%"></span></div>
          <em>${n} de ${items.length}</em></div>
      </div>
      ${items.map((it, i) => {
        const q = h[i];
        return `<label class="chk-item ${q ? 'ok' : ''}">
          <input type="checkbox" ${q?'checked':''} onchange="toggleItem('${t.id}',${i},this)">
          <span class="chk-caja"><ion-icon name="checkmark-outline"></ion-icon></span>
          <span class="chk-texto">${escapeHtml(it)}</span>
          ${q ? `<span class="chk-quien">${escapeHtml(q.nombre||'')} · ${new Date(q.at).toLocaleTimeString('es',{hour:'numeric',minute:'2-digit'})}</span>` : ''}
        </label>`;
      }).join('')}
    </div>`;
  }).join('');

  body.innerHTML = deHoy.length ? html
    : `<div class="empty-state"><ion-icon name="checkbox-outline"></ion-icon><p>No hay checklists para hoy en esta tienda. Crea la primera.</p></div>`;
  document.getElementById('hoyResumen').textContent =
    total ? `${listos} de ${total} · ${Math.round(listos/total*100)}%` : 'Sin tareas hoy';
  document.getElementById('hoyResumen').className =
    'badge ' + (total && listos === total ? 'badge-green' : 'badge-blue');
}

async function toggleItem(tareaId, idx, chk) {
  chk.disabled = true;
  try {
    await marcarItem(tareaId, todayStr(), getSelectedStore(), idx, chk.checked);
    // Estado local al día sin recargar todo
    const doc = hechos[tareaId] || (hechos[tareaId] = { hechos:{} });
    if (chk.checked) doc.hechos[idx] = { nombre: SESSION.name, at: Date.now() };
    else delete doc.hechos[idx];
    pintarHoy();
  } catch (err) {
    chk.checked = !chk.checked;
    toast('No se pudo guardar: ' + err.message, 'error');
  } finally { chk.disabled = false; }
}

function pintarPlantillas() {
  const body = document.getElementById('tplBody');
  document.getElementById('tplCount').textContent =
    tareas.length + (tareas.length === 1 ? ' checklist' : ' checklists');
  body.innerHTML = tareas.length ? tareas.map(t => `
    <div class="tpl-row" onclick="abrirTarea('${t.id}')">
      <ion-icon name="checkbox-outline"></ion-icon>
      <div style="flex:1;min-width:0">
        <strong>${escapeHtml(t.titulo)}</strong>
        <div class="tpl-sub">${(t.items||[]).length} renglones ·
          ${!t.dias || !t.dias.length ? 'Todos los días' : t.dias.map(d=>DIA_NOMBRE[d]).join(', ')}</div>
      </div>
      <ion-icon name="create-outline" style="color:var(--text-light)"></ion-icon>
    </div>`).join('')
    : `<div class="empty-state"><ion-icon name="checkbox-outline"></ion-icon><p>Sin checklists todavía.</p></div>`;
}

function abrirTarea(id) {
  const t = id ? tareas.find(x => x.id === id) : null;
  document.getElementById('tareaTitulo').textContent = t ? 'Editar checklist' : 'Nueva checklist';
  document.getElementById('tId').value = t ? t.id : '';
  document.getElementById('tNombre').value = t ? t.titulo : '';
  document.getElementById('tItems').value = t ? (t.items||[]).join('\n') : '';
  document.getElementById('tBorrar').style.display = t ? '' : 'none';
  const dias = (t && t.dias) || [];
  document.getElementById('tDias').innerHTML = [1,2,3,4,5,6,0].map(d =>
    `<label class="dia-chip ${dias.includes(d)?'on':''}">
       <input type="checkbox" value="${d}" ${dias.includes(d)?'checked':''}
              onchange="this.parentElement.classList.toggle('on', this.checked)">${DIA_NOMBRE[d]}</label>`).join('');
  openModal('tareaModal');
}

async function guardarTarea() {
  const titulo = document.getElementById('tNombre').value.trim();
  const items = document.getElementById('tItems').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if (!titulo) { toast('Ponle nombre a la checklist.', 'error'); return; }
  if (!items.length) { toast('Escribe al menos un renglón.', 'error'); return; }
  const dias = [...document.querySelectorAll('#tDias input:checked')].map(i => Number(i.value));
  const btn = document.getElementById('tGuardar');
  btn.disabled = true;
  try {
    await saveTarea(document.getElementById('tId').value || null,
                    { titulo, items, dias, store: getSelectedStore() });
    closeModal('tareaModal');
    toast('Checklist guardada', 'success');
    render();
  } catch (err) { toast('Error: ' + err.message, 'error'); }
  finally { btn.disabled = false; }
}

async function borrarTarea() {
  const id = document.getElementById('tId').value;
  if (!id) return;
  if (!confirm('¿Eliminar esta checklist? Lo hecho en días anteriores no se borra.')) return;
  try {
    await deleteTarea(id);
    closeModal('tareaModal');
    toast('Checklist eliminada', 'info');
    render();
  } catch (err) { toast('Error: ' + err.message, 'error'); }
}
</script>
