<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-logo">
      <div class="brand-icon"><svg class="brand-mark" viewBox="7 0 44 44" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M8.6 27C7.6 15.4 15.4 5.4 26.6 5.4C33.4 5.4 37.6 9.2 39 14.3L46.3 16.9C49.5 18.1 49.9 21.3 46.7 25.5C44.9 27.9 42.7 29.6 40.5 30.4C41.9 27.6 41.7 25 40.5 23.6C38.7 21.7 36.1 21.2 33.7 22C32.1 23.8 30.7 26 29.3 28.2C27.7 30.7 26.3 33.8 25 38.6L10.6 33.2C9.2 31.2 8.7 29 8.6 27ZM28.9 13.3C31.1 12.3 33.7 13.1 34.3 15.1C33.1 16.5 30.5 16.5 28.9 15.3Z"/></svg></div>
      <div class="brand-text">
        <div class="brand-name">El Águila</div>
        <div class="brand-sub">Portal de Colaboradores</div>
      </div>
    </div>
  </div>

  <div class="store-switcher" id="storeSwitcher"></div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Principal</div>
    <a href="index.html" data-manager-only class="nav-link"><ion-icon name="speedometer-outline"></ion-icon><span>Panel</span></a>
    <a href="employees.html" data-manager-only class="nav-link"><ion-icon name="people-outline"></ion-icon><span>Colaboradores</span></a>
    <a href="jobs.html" data-manager-only class="nav-link"><ion-icon name="briefcase-outline"></ion-icon><span>Puestos</span></a>
    <div class="nav-section-label">Operación</div>
    <a href="pedidos.html" class="nav-link"><ion-icon name="clipboard-outline"></ion-icon><span>Pedidos</span></a>
    <a href="grupo.html" class="nav-link"><ion-icon name="chatbubbles-outline"></ion-icon><span>Grupo</span></a>
    <div class="nav-section-label">Tiempo</div>
    <a href="hours.html" data-manager-only class="nav-link active"><ion-icon name="time-outline"></ion-icon><span>Horas</span></a>
    <a href="pay-statement.html" data-manager-only class="nav-link"><ion-icon name="receipt-outline"></ion-icon><span>Nómina</span></a>
    <a href="time-off.html" class="nav-link"><ion-icon name="calendar-outline"></ion-icon><span>Permisos</span></a>
  </nav>

  <div class="sidebar-footer">
    <div id="sidebarUser"></div>
    <button class="sidebar-signout" onclick="signOut()">
      <ion-icon name="log-out-outline"></ion-icon> <span>Cerrar Sesión</span>
    </button>
  </div>
</aside>

<main class="main">
  <div class="page-header-row">
    <div class="page-header">
      <h1>Control de Horas</h1>
      <p>Consulta y administra las horas de los colaboradores por período de pago.</p>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-outline" onclick="openAddEntry()"><ion-icon name="add-outline"></ion-icon> Agregar Registro</button>
      <button class="btn btn-primary" onclick="openSavePeriod()"><ion-icon name="save-outline"></ion-icon> Guardar Período</button>
    </div>
  </div>

  <!-- Navegación de Período -->
  <div class="period-nav">
    <button class="btn-icon" onclick="shiftPeriod(-1)"><ion-icon name="chevron-back-outline"></ion-icon></button>
    <div style="flex:1;text-align:center">
      <div class="period-label" id="periodLabel">—</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px" id="periodSub"></div>
    </div>
    <button class="btn-icon" onclick="shiftPeriod(1)"><ion-icon name="chevron-forward-outline"></ion-icon></button>
  </div>

  <!-- Resumen -->
  <div id="periodSummary" style="display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap"></div>

  <!-- Acordeón -->
  <div id="hoursAccordion">
    <div class="skeleton-card" style="height:66px;margin-bottom:11px"></div>
    <div class="skeleton-card" style="height:66px;margin-bottom:11px"></div>
    <div class="skeleton-card" style="height:66px"></div>
  </div>
</main>

<!-- Modal Agregar Registro -->
<div class="modal-overlay" id="addEntryModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Agregar Registro de Horas</h3>
      <button class="modal-close" onclick="closeModal('addEntryModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Colaborador</label>
        <select id="entryEmp"></select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="entryDate">
        </div>
        <div class="form-group">
          <label>Entrada</label>
          <input type="time" id="entryIn" value="08:00">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Salida</label>
          <input type="time" id="entryOut" value="16:00">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('addEntryModal')">Cancelar</button>
      <button class="btn btn-primary" id="saveEntryBtn" onclick="doSaveEntry()">Agregar Registro</button>
    </div>
  </div>
</div>

<!-- Modal Guardar Período -->
<div class="modal-overlay" id="savePeriodModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3>Guardar Período y Generar Nómina</h3>
      <button class="modal-close" onclick="closeModal('savePeriodModal')">&times;</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-muted);font-size:14px" id="savePeriodText"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('savePeriodModal')">Cancelar</button>
      <button class="btn btn-primary" id="confirmSaveBtn" onclick="doSavePeriod()">Confirmar y Guardar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
let periodIndex = getPeriodIndex(new Date());
const DAY_NAMES = DIAS_CORTOS;
requireAuth(() => render());


function shiftPeriod(dir) { periodIndex += dir; render(); }

async function render() {
  const period = getPeriodByIndex(periodIndex);
  const cur    = getCurrentPeriod();

  document.getElementById('periodLabel').textContent = formatPeriodLabel(period);
  document.getElementById('periodSub').textContent   =
    periodIndex === cur.index ? 'Período actual' :
    periodIndex  < cur.index ? 'Período anterior' : 'Período futuro';

  const store = getSelectedStore();
  const [allEmps, jobs, cis] = await Promise.all([
    getEmployees(),
    getJobs(),
    getClockInsRange(period.start, period.end)
  ]);

  let emps = allEmps.filter(e => e.status === 'active');
  if (store !== 'all') emps = emps.filter(e => e.store === store);

  // Summary
  const totalHrs = emps.reduce((s, e) => {
    return s + cis.filter(c => c.employeeId === e.id && c.clockOut).reduce((h, c) => h + (c.hours||0), 0);
  }, 0);

  document.getElementById('periodSummary').innerHTML = `
    <div class="stat-card" style="flex:1;min-width:140px">
      <div class="stat-label">Horas Totales</div>
      <div class="stat-value">${totalHrs.toFixed(1)}</div>
    </div>
    <div class="stat-card" style="flex:1;min-width:140px">
      <div class="stat-label">Colaboradores</div>
      <div class="stat-value">${emps.length}</div>
    </div>
    <div class="stat-card" style="flex:1;min-width:140px">
      <div class="stat-label">Promedio por Colaborador</div>
      <div class="stat-value">${emps.length ? (totalHrs/emps.length).toFixed(1) : '0'}</div>
    </div>
  `;
  animateValues('periodSummary');

  // Days in period
  const days = [];
  let d = new Date(period.start + 'T00:00:00');
  const endD = new Date(period.end + 'T00:00:00');
  while (d <= endD) { days.push(toDateStr(d)); d.setDate(d.getDate()+1); }

  const acc = document.getElementById('hoursAccordion');
  if (emps.length === 0) {
    acc.innerHTML = `<div class="card"><div class="card-body"><div class="empty-state"><ion-icon name="time-outline"></ion-icon><p>No hay colaboradores para mostrar.</p></div></div></div>`;
    return;
  }

  acc.innerHTML = emps.map((emp, idx) => {
    const job     = jobs.find(j => j.id === emp.jobId);
    const empCIs  = cis.filter(c => c.employeeId === emp.id);
    const totalH  = empCIs.filter(c => c.clockOut).reduce((s,c) => s+(c.hours||0), 0);
    const estPay  = (totalH * (emp.hourlyRate || 0)).toFixed(2);

    const rows = days.map(dateStr => {
      const d2       = new Date(dateStr + 'T00:00:00');
      const isWeekend = d2.getDay() === 0 || d2.getDay() === 6;
      const dayCIs   = empCIs.filter(c => c.date === dateStr);
      const future   = dateStr > todayStr();

      if (dayCIs.length === 0) {
        return `<tr style="${isWeekend?'color:var(--text-light);background:#fafbfd':''}">
          <td>${formatDateShort(dateStr)}</td>
          <td>${DAY_NAMES[d2.getDay()]}</td>
          <td colspan="2" style="color:var(--text-light)">${future?'—':isWeekend?'Fin de semana':'Sin registro'}</td>
          <td>—</td>
          <td><span class="badge badge-gray">${future?'próximo':isWeekend?'—':'ausente'}</span></td>
          <td></td>
        </tr>`;
      }

      return dayCIs.map(ci => `<tr>
        <td>${formatDateShort(ci.date)}</td>
        <td>${DAY_NAMES[d2.getDay()]}</td>
        <td>${formatTime(ci.clockIn)}</td>
        <td>${ci.clockOut ? formatTime(ci.clockOut) : '<span class="badge badge-green">En curso</span>'}</td>
        <td><strong>${ci.clockOut ? (ci.hours||0).toFixed(2)+'h' : '—'}</strong></td>
        <td>${ci.clockOut ? '<span class="badge badge-green">Completo</span>' : '<span class="badge badge-yellow">En curso</span>'}</td>
        <td><button class="btn-icon btn-sm" onclick="doDeleteEntry('${ci.id}')" title="Eliminar"><ion-icon name="close-outline" style="font-size:11px"></ion-icon></button></td>
      </tr>`).join('');
    }).join('');

    return `
    <div class="hours-employee" style="animation-delay:${(idx * 0.045).toFixed(2)}s">
      <div class="hours-emp-header" onclick="toggleEmp(this)">
        <div class="hours-emp-left">
          ${avatarHtml(emp.name)}
          <div>
            <div class="employee-name">${emp.name}</div>
            <div class="employee-sub">${job ? job.title : '—'} · ${storeShort(emp.store)}</div>
          </div>
        </div>
        <div class="hours-emp-right">
          <div class="hours-total">${totalH.toFixed(2)} h en total</div>
          <span class="badge badge-gray">$${estPay} aprox.</span>
          <ion-icon name="chevron-down-outline" style="color:var(--text-muted);font-size:12px;transition:transform 0.2s"></ion-icon>
        </div>
      </div>
      <div class="hours-emp-body">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Fecha</th><th>Día</th><th>Entrada</th><th>Salida</th><th>Horas</th><th>Estado</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleEmp(header) {
  const body = header.nextElementSibling;
  const icon = header.querySelector('ion-icon');
  body.classList.toggle('open');
  if (icon) icon.style.transform = body.classList.contains('open') ? 'rotate(180deg)' : '';
}

let empsCache = [];

async function openAddEntry() {
  empsCache = await getEmployees();
  const active = empsCache.filter(e => e.status === 'active');
  document.getElementById('entryEmp').innerHTML = active.map(e =>
    `<option value="${e.id}">${e.name} — ${storeShort(e.store)}</option>`
  ).join('');
  document.getElementById('entryDate').value = todayStr();
  openModal('addEntryModal');
}

async function doSaveEntry() {
  const empId   = document.getElementById('entryEmp').value;
  const dateStr = document.getElementById('entryDate').value;
  const inTime  = document.getElementById('entryIn').value;
  const outTime = document.getElementById('entryOut').value;
  if (!empId || !dateStr || !inTime || !outTime) { toast('Completa todos los campos.', 'error'); return; }
  if (outTime <= inTime) { toast('La salida debe ser posterior a la entrada.', 'error'); return; }

  const emp = empsCache.find(e => e.id === empId);
  const ciTime  = new Date(`${dateStr}T${inTime}:00`);
  const coTime  = new Date(`${dateStr}T${outTime}:00`);
  const hours   = calculateHours(ciTime.toISOString(), coTime.toISOString());

  const btn = document.getElementById('saveEntryBtn');
  btn.disabled = true;
  try {
    await db.collection('ClockIns').add({
      employeeId: empId,
      store: emp ? emp.store : '',
      clockIn:  firebase.firestore.Timestamp.fromDate(ciTime),
      clockOut: firebase.firestore.Timestamp.fromDate(coTime),
      date: dateStr,
      hours
    });
    closeModal('addEntryModal');
    toast(`Registro agregado · ${hours.toFixed(2)} h`, 'success');
    render();
  } catch (err) {
    toast('Error al guardar: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

async function doDeleteEntry(id) {
  if (!confirm('¿Eliminar este registro?')) return;
  await deleteClockIn(id);
  toast('Registro eliminado', 'info');
  render();
}

function openSavePeriod() {
  const period = getPeriodByIndex(periodIndex);
  document.getElementById('savePeriodText').textContent =
    `¿Guardar y generar la nómina de ${formatPeriodLabel(period)}? Se reemplazarán los recibos existentes de este período.`;
  openModal('savePeriodModal');
}

async function doSavePeriod() {
  const period = getPeriodByIndex(periodIndex);
  const btn    = document.getElementById('confirmSaveBtn');
  btn.disabled = true;
  try {
    const [emps, cis] = await Promise.all([
      getEmployees(),
      getClockInsRange(period.start, period.end)
    ]);
    const active = emps.filter(e => e.status === 'active');

    // Delete existing statements for this period
    const existing = await getPayStatements(period.start);
    await Promise.all(existing.map(s => db.collection('PayStatements').doc(s.id).delete()));

    // Create new
    await Promise.all(active.map(emp => {
      const empHours = cis
        .filter(c => c.employeeId === emp.id && c.clockOut)
        .reduce((s, c) => s + (c.hours || 0), 0);
      const gross = Math.round(empHours * emp.hourlyRate * 100) / 100;
      return savePayStatement({
        periodStart: period.start,
        periodEnd:   period.end,
        employeeId:  emp.id,
        hours:       Math.round(empHours * 100) / 100,
        rate:        emp.hourlyRate || 0,
        gross,
        status:      'pending',
        paidDate:    null
      });
    }));

    closeModal('savePeriodModal');
    toast(`Período guardado · ${active.length} ${active.length === 1 ? 'recibo generado' : 'recibos generados'}`, 'success');
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
