<main class="main">
  <div class="page-header-row">
    <div class="page-header">
      <h1>Reportes</h1>
      <p>Incidentes y novedades reportadas por el equipo, con foto.</p>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-outline" onclick="revisarTodos(this)"><ion-icon name="checkmark-done-outline"></ion-icon> Marcar todos revisados</button>
      <button class="btn btn-primary" onclick="abrirNuevoRep()"><ion-icon name="add-outline"></ion-icon> Nuevo reporte</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="filtrarRep('nuevo',this)">Nuevos</button>
    <button class="tab-btn" onclick="filtrarRep('revisado',this)">Revisados</button>
    <button class="tab-btn" onclick="filtrarRep('todos',this)">Todos</button>
  </div>

  <div id="repLista"></div>
</main>

<!-- Modal nuevo reporte -->
<div class="modal-overlay" id="repModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Nuevo reporte</h3>
      <button class="modal-close" onclick="closeModal('repModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>¿Qué pasó? *</label>
        <textarea id="repTexto" rows="4" placeholder="Describe el incidente o la novedad..."></textarea>
      </div>
      <div class="form-group">
        <label>Foto <span style="font-weight:400;color:var(--text-muted)">— opcional</span></label>
        <input type="file" id="repFoto" accept="image/*">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('repModal')">Cancelar</button>
      <button class="btn btn-primary" id="repGuardar" onclick="guardarRep()">Enviar reporte</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
let reportes = [], filtroRep = 'nuevo';

requireAuth(() => render(), { allow:['manager'] });

async function render() {
  const host = document.getElementById('repLista');
  host.innerHTML = '<div class="empty-state"><ion-icon name="sync-outline" class="gira"></ion-icon></div>';
  try {
    reportes = await getReportes();
    pintar();
  } catch (err) {
    host.innerHTML = `<div class="empty-state" style="color:var(--danger)">Error: ${escapeHtml(err.message)}</div>`;
  }
}

function filtrarRep(f, btn) {
  filtroRep = f;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  pintar();
}

function pintar() {
  const store = getSelectedStore();
  const lista = reportes
    .filter(r => r.store === store)
    .filter(r => filtroRep === 'todos' || (r.status || 'nuevo') === filtroRep);
  const host = document.getElementById('repLista');
  if (!lista.length) {
    host.innerHTML = `<div class="card"><div class="card-body">
      <div class="empty-state"><ion-icon name="shield-checkmark-outline"></ion-icon>
      <p>${filtroRep === 'nuevo' ? 'No hay reportes nuevos en esta tienda.' : 'Nada por aquí.'}</p></div></div></div>`;
    return;
  }
  host.innerHTML = lista.map(r => {
    const d = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate() : null;
    const nuevo = (r.status || 'nuevo') === 'nuevo';
    return `<div class="card rep-card ${nuevo ? 'rep-nuevo' : ''}">
      <div class="card-body" style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
        ${r.foto ? `<img class="rep-foto" src="${r.foto}" alt="Foto del reporte" loading="lazy"
                         style="aspect-ratio:${(r.w||4)}/${(r.h||3)}" onclick="verFoto('${r.foto}')">` : ''}
        <div style="flex:1;min-width:220px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            ${avatarHtml(r.nombre || '?', 30)}
            <strong>${escapeHtml(r.nombre || '—')}</strong>
            ${nuevo ? '<span class="badge badge-red">Nuevo</span>'
                    : `<span class="badge badge-green">Revisado${r.revisadoPor ? ' · ' + escapeHtml(r.revisadoPor) : ''}</span>`}
            <span style="margin-left:auto;color:var(--text-light);font-size:12px">
              ${d ? formatDate(toDateStr(d)) + ' · ' + d.toLocaleTimeString('es',{hour:'numeric',minute:'2-digit'}) : ''}</span>
          </div>
          <p style="margin:10px 0 0;font-size:14px;line-height:1.6;white-space:pre-wrap">${escapeHtml(r.texto || '')}</p>
          <div style="display:flex;gap:8px;margin-top:14px">
            ${nuevo ? `<button class="btn btn-primary btn-sm" onclick="revisarRep('${r.id}',this)">
                         <ion-icon name="checkmark-outline"></ion-icon> Marcar revisado</button>` : ''}
            <button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="borrarRep('${r.id}',this)">
              <ion-icon name="trash-outline"></ion-icon> Eliminar</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function revisarRep(id, btn) {
  btn.disabled = true;
  try {
    await marcarReporteVisto(id);
    const r = reportes.find(x => x.id === id);
    if (r) { r.status = 'revisado'; r.revisadoPor = SESSION.name; }
    pintar();
    toast('Reporte marcado como revisado', 'success');
  } catch (err) { btn.disabled = false; toast('Error: ' + err.message, 'error'); }
}

async function borrarRep(id, btn) {
  if (!confirm('¿Eliminar este reporte definitivamente?')) return;
  btn.disabled = true;
  try {
    await deleteReporte(id);
    reportes = reportes.filter(x => x.id !== id);
    pintar();
    toast('Reporte eliminado', 'info');
  } catch (err) { btn.disabled = false; toast('Error: ' + err.message, 'error'); }
}

function abrirNuevoRep() {
  document.getElementById('repTexto').value = '';
  document.getElementById('repFoto').value = '';
  openModal('repModal');
}

async function guardarRep() {
  const texto = document.getElementById('repTexto').value.trim();
  if (!texto) { toast('Describe lo que pasó.', 'error'); return; }
  const file = document.getElementById('repFoto').files[0] || null;
  const btn = document.getElementById('repGuardar');
  btn.disabled = true;
  btn.innerHTML = '<ion-icon name="sync-outline" class="gira"></ion-icon> Enviando...';
  try {
    await crearReporte({ texto, store: getSelectedStore(), file }, pct => {
      if (pct !== null) btn.innerHTML = `Subiendo foto ${pct}%`;
    });
    closeModal('repModal');
    toast('Reporte enviado', 'success');
    render();
  } catch (err) { toast('No se pudo enviar: ' + err.message, 'error'); }
  finally { btn.disabled = false; btn.innerHTML = 'Enviar reporte'; }
}

// Ver la foto en grande (mismo visor que el chat)
function verFoto(url) {
  let v = document.getElementById('visorFoto');
  if (!v) {
    v = document.createElement('div');
    v.id = 'visorFoto'; v.className = 'visor-foto';
    v.onclick = () => v.classList.remove('on');
    v.innerHTML = '<button class="visor-x" aria-label="Cerrar"><ion-icon name="close-outline"></ion-icon></button><img alt="Foto">';
    document.body.appendChild(v);
  }
  v.querySelector('img').src = url;
  v.classList.add('on');
}
// Lote: todos los reportes nuevos de la tienda visible, revisados de una vez
async function revisarTodos(btn) {
  const store = getSelectedStore();
  const nuevos = reportes.filter(r => r.store === store && (r.status || 'nuevo') === 'nuevo');
  if (!nuevos.length) { toast('No hay reportes nuevos en esta tienda.', 'info'); return; }
  if (!confirm(`¿Marcar revisados los ${nuevos.length} reportes nuevos de ${storeName(store)}?`)) return;
  btn.disabled = true;
  try {
    await Promise.all(nuevos.map(r => marcarReporteVisto(r.id)));
    nuevos.forEach(r => { r.status = 'revisado'; r.revisadoPor = SESSION.name; });
    pintar();
    toast(`${nuevos.length} reportes revisados`, 'success');
  } catch (err) { toast('Error: ' + err.message, 'error'); }
  finally { btn.disabled = false; }
}
</script>
